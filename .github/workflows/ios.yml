name: iOS

# Код пишется в облачном контейнере на Linux, где SwiftUI не собрать: этот workflow — компилятор.
# PSNKit не зависит от UIKit, поэтому его тесты идут и на Linux (быстро), и на симуляторе iOS.
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # DesignKit's rules (tokens, no swipe actions or system Form, section rows) at the pinned
  # version, as docs/agents.md of DesignKit asks before a push.
  design-lint:
    name: DesignKit lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: DesignKit's lint at the pinned version
        run: |
          VERSION=$(python3 -c 'import re; print(re.search(r"DesignKit:\s*\n\s*url:.*\n\s*exactVersion:\s*\"([^\"]+)\"", open("ios/project.yml").read()).group(1))')
          echo "DesignKit $VERSION"
          git clone --depth 1 --branch "$VERSION" https://github.com/dkicekeeper/DesignKit "$RUNNER_TEMP/DesignKit"
          python3 "$RUNNER_TEMP/DesignKit/scripts/designkit_lint.py" all --source ios/Platina --source ios/PlatinaWidgets
      - name: Copy lint (short strings, no long dashes; CLAUDE.md, «Тексты»)
        run: python3 scripts/copy_lint.py

  psnkit-linux:
    name: PSNKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: swift test
        working-directory: ios/Packages/PlatinaKit
        run: swift test

  # The account runs a few macOS jobs at a time, shared by Platina, Tenra, Dalada and DesignKit.
  # A commit pushed to a branch with a PR (or to a branch and to main) starts this workflow more
  # than once: the earliest run of the commit that is not cancelled builds it, a later one skips
  # the build and names that run in its summary. A manual run always builds; an API error builds.
  once:
    name: First run of this commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Look for an earlier run of this commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          EARLIER=""
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            EARLIER=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios.yml/runs?head_sha=$SHA&per_page=100" \
              --jq "[.workflow_runs[] | select(.id < $GITHUB_RUN_ID and .conclusion != \"cancelled\")] | min_by(.id) | .html_url // empty") || EARLIER=""
          fi
          if [ -n "$EARLIER" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "**Build skipped:** $EARLIER builds this commit." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build app and run package tests
    needs: once
    if: needs.once.outputs.build == 'true'
    # GitHub's Xcode 27 image (public preview); the newest stable 27.x, the iOS 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27"

      - name: Xcode and SDK
        run: |
          xcodebuild -version
          echo "iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app for iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Platina.xcodeproj \
            -scheme Platina \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning: .*Platina/|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log"

      # Whether the app still answers after a game opens from the Path, and from the library for
      # comparison (2026-11-26: a game opened from the Path froze the app on the owner's phone).
      # scripts/hang_probe.py launches the demo at each screen and samples the main thread; a hang
      # prints its heaviest frames and SwiftUI's warnings. Not blocking until the Path answers.
      - name: Hang probe (a game opened from the Path and from the library)
        working-directory: ios
        timeout-minutes: 25
        continue-on-error: true
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [(runtime, d) for runtime, items in sorted(devices.items(), reverse=True)
                    if ".iOS-" in runtime for d in items if d["name"].startswith("iPhone")]
          regular = [d for _, d in phones if not re.search(r"Duo|Fold|Flip", d["name"])]
          pro = [d for d in regular if re.fullmatch(r"iPhone \d+ Pro", d["name"])]
          print((pro or regular or [d for _, d in phones])[0]["udid"])
          ')
          xcrun simctl list devices | grep "$DEVICE_ID" || true
          python3 ../scripts/hang_probe.py --device "$DEVICE_ID" \
            --app build/Build/Products/Debug-iphonesimulator/Platina.app \
            --out "$RUNNER_TEMP/hang-probe" pathGame+loop pathGame game

      - name: Run package tests on a simulator
        working-directory: ios/Packages/PlatinaKit
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ids = [d["udid"] for runtime, items in sorted(devices.items(), reverse=True)
                 if ".iOS-" in runtime for d in items if d["name"].startswith("iPhone")]
          print(ids[0])
          ')
          echo "Simulator: $DEVICE_ID"
          SCHEMES=$(xcodebuild -list -json | python3 -c 'import json, sys; print("\n".join(json.load(sys.stdin)["workspace"]["schemes"]))')
          echo "Schemes:"; echo "$SCHEMES"
          SCHEME=$(echo "$SCHEMES" | grep -x 'PlatinaKit-Package' || echo "$SCHEMES" | grep -x 'PSNKit' || echo "$SCHEMES" | head -1)
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "id=$DEVICE_ID" \
            -derivedDataPath build \
            -resultBundlePath "$RUNNER_TEMP/PackageTests.xcresult" \
            -quiet

      - name: Build log on failure
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/build.log" ] && grep -E -B2 -A6 "error:" "$RUNNER_TEMP/build.log" | head -200 || true

      # With -quiet only the names of failed tests show. Here: what each failed check said.
      - name: Test failures
        if: failure()
        run: |
          for RESULT in "$RUNNER_TEMP/PackageTests.xcresult"; do
          [ -d "$RESULT" ] || { echo "No test results in $RESULT"; continue; }
          xcrun xcresulttool get test-results summary --path "$RESULT" --format json | python3 -c '
          import json, sys
          summary = json.load(sys.stdin)
          for failure in summary.get("testFailures", []):
              print("✘", failure.get("targetName", ""), failure.get("testName", ""))
              print("  ", failure.get("failureText", "").replace("\n", "\n   "))
          ' || true
          done
