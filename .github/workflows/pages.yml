name: Pages

# The App Store's pages on GitHub Pages (https://dkicekeeper.github.io/Platina/…): the privacy
# policy, support and a short index. Only docs/public is published, not the internal docs.
# Once: Settings → Pages → Build and deployment → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "docs/public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  # deploy-pages finds the uploaded site among the run's artifacts: in a private repository
  # listing them needs actions: read (without it: "No artifacts named github-pages").
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Two jobs, as in GitHub's starter workflows: the deploy reads the site among the artifacts of a
  # finished job (in one job it found none, five runs in a row).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
