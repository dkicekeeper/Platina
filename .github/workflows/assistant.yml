name: Assistant server

# The Cloudflare Worker behind Plati, Platina's assistant (server/assistant, docs/assistant.md).
# Push: typecheck and unit tests. Manual run (Actions → Assistant server → Run workflow):
#   setup   create the KV namespaces ATTEST, QUOTA and GUIDES if missing, print their ids
#   deploy  deploy the Worker and upload its secrets; prints the Worker's address
#   eval    run the model eval against the Claude API (spends credits; see server/assistant/README.md)
#   smoke   one real walkthrough build (plan + first chapter) outside the Worker, with timings
#           and the API's errors (about the cost of one build in the app)
#   probe   what web_fetch returns from a guide page: text, image URLs, YouTube ids (two calls)
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  setup, deploy
#   ANTHROPIC_API_KEY                            uploaded to the Worker on deploy
#   PLATINA_DEV_TOKEN                            optional: uploaded as the Worker's DEV_TOKEN on
#                                                deploy (the simulator's way past App Attest);
#                                                when it is empty, deploy removes DEV_TOKEN
#   APNS_KEY_P8, APNS_KEY_ID                     uploaded on deploy: the APNs auth key (.p8, its
#                                                whole text) and its id, for trophy notifications
#   ANTHROPIC_EVAL_API_KEY                       eval: a key of a separate Anthropic workspace
#                                                with its own spend limit, so an eval never
#                                                spends the limit that keeps Plati talking

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "server/assistant/**"
      - ".github/workflows/assistant.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        type: choice
        options: [test, setup, deploy, eval, smoke, probe]
        default: test
      models:
        description: "eval: comma-separated model ids"
        default: "claude-haiku-5-5,claude-sonnet-5-5"
      effort:
        description: "eval: comma-separated effort levels"
        default: "low"
      cases:
        description: "eval: comma-separated case ids, or all"
        default: "all"
      game:
        description: "smoke: a game by name (empty: Cult of the Lamb with its real trophy list)"
        default: ""

concurrency:
  group: assistant-${{ github.ref }}-${{ inputs.action || 'push' }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: server/assistant

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/assistant/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  setup:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'setup'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create the KV namespaces if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/kv-namespaces.mjs ensure

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/assistant/package-lock.json
      - run: npm ci
      - name: Secrets present
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$ANTHROPIC_API_KEY" ] || missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Add the repository secrets:$missing (see server/assistant/README.md)."
            exit 1
          fi
      - name: KV namespace ids
        run: node scripts/kv-namespaces.mjs fill
      - name: Deploy the Worker
        run: npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
      - name: Upload the secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLATINA_DEV_TOKEN: ${{ secrets.PLATINA_DEV_TOKEN }}
        run: |
          printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          if [ -n "$PLATINA_DEV_TOKEN" ]; then
            printf '%s' "$PLATINA_DEV_TOKEN" | npx wrangler secret put DEV_TOKEN
          else
            echo "No PLATINA_DEV_TOKEN: the Worker keeps no DEV_TOKEN (App Attest only)."
            npx wrangler secret delete DEV_TOKEN 2>/dev/null || true
          fi
      - name: Trophy notifications' secrets
        env:
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
        run: |
          # The key sealing the watchers' PSN tokens: made once, here, and never shown. A new one
          # would make every stored grant unreadable (each watcher asks its person to sign in again).
          # Only a clear "not there" makes one: a failed listing stops the deploy instead.
          secrets=$(npx wrangler secret list --format json) || { echo "::error::Could not list the Worker's secrets."; exit 1; }
          state=$(printf '%s' "$secrets" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).some(x=>x.name==="TOKEN_KEY")?"set":"missing")}catch{console.log("unknown")}})')
          case "$state" in
            set) echo "TOKEN_KEY is set." ;;
            missing)
              openssl rand -base64 32 | tr -d '\n' | npx wrangler secret put TOKEN_KEY
              echo "TOKEN_KEY created." ;;
            *) echo "::error::Could not read the Worker's secrets list."; exit 1 ;;
          esac
          if [ -n "$APNS_KEY_P8" ] && [ -n "$APNS_KEY_ID" ]; then
            printf '%s' "$APNS_KEY_P8" | npx wrangler secret put APNS_KEY_P8
            printf '%s' "$APNS_KEY_ID" | npx wrangler secret put APNS_KEY_ID
          else
            echo "::warning::No APNS_KEY_P8 / APNS_KEY_ID: trophy notifications answer 503 alerts_unavailable (docs/assistant.md §9)."
          fi
      - name: The Worker's address
        run: |
          url=$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          echo "Worker: ${url:-see the deploy log above}"
          if [ -n "$url" ]; then
            echo "### Plati's server" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`PLATINA_ASSISTANT_HOST = ${url#https://}\` (ios/Config/Local.xcconfig, or the repository variable for TestFlight). Health: ${url}/v1/health" >> "$GITHUB_STEP_SUMMARY"
            curl -fsS "$url/v1/health" || echo "Health check failed: the first deploy can take a minute to propagate."
          fi

  eval:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'eval'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/assistant/package-lock.json
      - run: npm ci
      - name: Eval key
        env:
          ANTHROPIC_EVAL_API_KEY: ${{ secrets.ANTHROPIC_EVAL_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_EVAL_API_KEY" ]; then
            echo "::error::Add the ANTHROPIC_EVAL_API_KEY secret: a key of a separate Anthropic workspace with its own spend limit. The production key is not used for evals."
            exit 1
          fi
      - name: Run the eval (spends API credits)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_EVAL_API_KEY }}
          MODELS: ${{ inputs.models }}
          EFFORT: ${{ inputs.effort }}
          CASES: ${{ inputs.cases }}
        run: npm run eval -- --models "$MODELS" --effort "$EFFORT" --cases "$CASES" --yes
      - name: Summary
        if: always()
        run: cat eval/out/*/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-eval
          path: server/assistant/eval/out/
          retention-days: 14

  smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'smoke'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/assistant/package-lock.json
      - run: npm ci
      - name: One walkthrough build (spends API credits)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_EVAL_API_KEY || secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/smoke-walkthrough.ts ru "${{ inputs.game }}"

  probe:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'probe'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/assistant/package-lock.json
      - run: npm ci
      - name: What web_fetch returns (spends API credits)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_EVAL_API_KEY || secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/probe-fetch.ts "Lies of P"
