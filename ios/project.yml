# XcodeGen: `cd ios && xcodegen generate` → Platina.xcodeproj (не хранится в git).
name: Platina

options:
  bundleIdPrefix: dakacom
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: ru

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: SY2L2VMQP7
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  # Точная версия; поднимается отдельным коммитом (docs/PLAN.md §6).
  DesignKit:
    url: https://github.com/dkicekeeper/DesignKit
    exactVersion: "8.11.0"
  PlatinaKit:
    path: Packages/PlatinaKit

targets:
  Platina:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Platina
        excludes:
          - Info.plist
    dependencies:
      - package: DesignKit
        product: DesignKit
      - package: PlatinaKit
        product: PSNKit
      - package: PlatinaKit
        product: PlatinaCore
      - package: PlatinaKit
        product: PlatinaStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dakacom.Platina
        PRODUCT_NAME: Platina
        INFOPLIST_FILE: Platina/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
