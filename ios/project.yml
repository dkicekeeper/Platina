# XcodeGen: `cd ios && xcodegen generate` → Platina.xcodeproj (не хранится в git).
name: Platina

options:
  bundleIdPrefix: dakacom
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: ru

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: SY2L2VMQP7
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  # Точная версия; поднимается отдельным коммитом (docs/PLAN.md §6).
  DesignKit:
    url: https://github.com/dkicekeeper/DesignKit
    exactVersion: "8.12.0"
  PlatinaKit:
    path: Packages/PlatinaKit

targets:
  Platina:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Platina
        excludes:
          - Info.plist
          - Platina.entitlements
      # The Live Activity's intents: in the app and in the extension.
      - path: Shared
    configFiles:
      Debug: Config/Platina.xcconfig
      Release: Config/Platina.xcconfig
    dependencies:
      - package: DesignKit
        product: DesignKit
      - package: PlatinaKit
        product: PSNKit
      - package: PlatinaKit
        product: PlatinaCore
      - package: PlatinaKit
        product: PlatinaStore
      - package: PlatinaKit
        product: PlatinaShared
      - package: PlatinaKit
        product: PlatinaAssistant
      - target: PlatinaWidgets
    preBuildScripts:
      # This project is generated from project.yml and is not in git: one generated before a pull
      # keeps the old DesignKit (Xcode showed 8.11.0 with 8.12.0 pinned). The git hooks regenerate
      # it (scripts/setup.sh, once); a build of a stale project stops here with what to run.
      - name: Check the project is current
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/project.yml
          - $(PROJECT_FILE_PATH)/project.pbxproj
        script: |
          pin=$(sed -n 's/^ *exactVersion: *"\([^"]*\)".*/\1/p' "$SRCROOT/project.yml" | head -n 1)
          if [ -n "$pin" ] && ! grep -Eq "version = \"?$pin\"?;" "$PROJECT_FILE_PATH/project.pbxproj"; then
            echo "error: ios/project.yml pins DesignKit $pin, but this Xcode project was generated before that. Run: cd ios && xcodegen generate (or scripts/setup.sh once, and git regenerates it after every pull)."
            exit 1
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dakacom.Platina
        PRODUCT_NAME: Platina
        INFOPLIST_FILE: Platina/Info.plist
        CODE_SIGN_ENTITLEMENTS: Platina/Platina.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # iPhone and iPad (stage 10; on Apple silicon Macs the iPad app runs as it is). iPad
        # takes every orientation (Info.plist, UISupportedInterfaceOrientations~ipad): App Store
        # Connect refuses an iPad app without them (error 90474), and multitasking needs them.
        TARGETED_DEVICE_FAMILY: "1,2"

  PlatinaWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: PlatinaWidgets
        excludes:
          - Info.plist
          - PlatinaWidgets.entitlements
      - path: Shared
    dependencies:
      - package: DesignKit
        product: DesignKit
      - package: PlatinaKit
        product: PlatinaShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dakacom.Platina.Widgets
        PRODUCT_NAME: PlatinaWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: PlatinaWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: PlatinaWidgets/PlatinaWidgets.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Platina
        SKIP_INSTALL: YES
