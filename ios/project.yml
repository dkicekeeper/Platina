# XcodeGen: `cd ios && xcodegen generate` → Platina.xcodeproj (не хранится в git).
name: Platina

options:
  bundleIdPrefix: dakacom
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: ru

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: SY2L2VMQP7
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  # Точная версия; поднимается отдельным коммитом (docs/PLAN.md §6).
  DesignKit:
    url: https://github.com/dkicekeeper/DesignKit
    exactVersion: "8.18.0"
  PlatinaKit:
    path: Packages/PlatinaKit

targets:
  Platina:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Platina
        excludes:
          - Info.plist
          - Platina.entitlements
      # The Live Activity's intents: in the app and in the extension.
      - path: Shared
    configFiles:
      Debug: Config/Platina.xcconfig
      Release: Config/Platina.xcconfig
    dependencies:
      - package: DesignKit
        product: DesignKit
      - package: PlatinaKit
        product: PSNKit
      - package: PlatinaKit
        product: PlatinaCore
      - package: PlatinaKit
        product: PlatinaStore
      - package: PlatinaKit
        product: PlatinaShared
      - package: PlatinaKit
        product: PlatinaAssistant
      - target: PlatinaWidgets
    # The App Store's screenshots run as its UI tests (scripts/capture_screenshots.sh).
    scheme:
      testTargets:
        - PlatinaUITests
    preBuildScripts:
      # This project is generated from project.yml and is not in git: one generated before a pull
      # keeps an old DesignKit or misses new files. The git hooks regenerate it (scripts/setup.sh,
      # once); a build of a stale project stops here with what to run.
      - &checkProject
        name: Check the project is current
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/project.yml
          - $(PROJECT_FILE_PATH)/project.pbxproj
          - $(SRCROOT)/../scripts/check-xcode-project.sh
        script: sh "$SRCROOT/../scripts/check-xcode-project.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dakacom.Platina
        PRODUCT_NAME: Platina
        INFOPLIST_FILE: Platina/Info.plist
        CODE_SIGN_ENTITLEMENTS: Platina/Platina.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # iPhone and iPad (stage 10; on Apple silicon Macs the iPad app runs as it is). iPad
        # takes every orientation (Info.plist, UISupportedInterfaceOrientations~ipad): App Store
        # Connect refuses an iPad app without them (error 90474), and multitasking needs them.
        TARGETED_DEVICE_FAMILY: "1,2"

  PlatinaWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: PlatinaWidgets
        excludes:
          - Info.plist
          - PlatinaWidgets.entitlements
      - path: Shared
    dependencies:
      - package: DesignKit
        product: DesignKit
      - package: PlatinaKit
        product: PlatinaShared
    # Built before the app: a stale project fails here first.
    preBuildScripts:
      - *checkProject
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dakacom.Platina.Widgets
        PRODUCT_NAME: PlatinaWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: PlatinaWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: PlatinaWidgets/PlatinaWidgets.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Platina
        SKIP_INSTALL: YES

  # The App Store's screenshots: the app in its demo, one launch per screen
  # (PlatinaUITests/ScreenshotCaptureTests.swift, scripts/capture_screenshots.sh).
  PlatinaUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: PlatinaUITests
    dependencies:
      - target: Platina
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dakacom.PlatinaUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Platina
        TARGETED_DEVICE_FAMILY: "1,2"
